[package]
name = "vocaro-sudachi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
sudachi = { git = "https://github.com/nyanrus/sudachi.rs", rev = "42a5f2debb9785794eac9cd5eb0b730a47be0f97", default-features = false }
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
